[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helloworld"
version = "0.1.0"
description = "A minimal Python HelloWorld project."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
helloworld = "helloworld:main"

[tool.setuptools.packages.find]
where = ["src"]
